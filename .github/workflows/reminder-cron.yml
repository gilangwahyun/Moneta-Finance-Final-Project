name: Daily Reminder Cron

on:
  schedule:
    # Runs at 13:00 UTC every day (20:00 WIB)
    - cron: '0 13 * * *'
  # Allow manual trigger from the GitHub Actions tab for testing
  workflow_dispatch:

jobs:
  trigger-reminder:
    name: Trigger Reminder Push Notification
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Call reminder cron endpoint
        run: |
          response=$(curl -s -L -o /dev/null -w "%{http_code}" \
            -X GET "${{ secrets.APP_URL }}/api/cron/reminder" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --retry 3 \
            --retry-delay 5 \
            --max-time 30)

          echo "HTTP Status: $response"

          if [ "$response" != "200" ]; then
            echo "Cron endpoint returned non-200 status: $response"
            exit 1
          fi
