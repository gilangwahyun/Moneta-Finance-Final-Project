name: Daily Digest Cron

on:
  schedule:
    # Runs every 15 minutes to catch user's specific digestTime
    - cron: '*/15 * * * *'
  # Allow manual trigger from the GitHub Actions tab for testing
  workflow_dispatch:

jobs:
  trigger-digest:
    name: Trigger Digest Push Notification
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Call digest cron endpoint
        run: |
          # Normalisasi URL (hapus trailing slash dan pastikan ada https://)
          RAW_URL="${{ secrets.APP_URL }}"
          CLEAN_URL="${RAW_URL%/}"
          if [[ ! "$CLEAN_URL" =~ ^https?:// ]]; then
            CLEAN_URL="https://$CLEAN_URL"
          fi
          
          echo "Hitting endpoint: $CLEAN_URL/api/cron/digest"

          response=$(curl -s -L -o /dev/null -w "%{http_code}" \
            "$CLEAN_URL/api/cron/digest" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --retry 3 \
            --retry-delay 5 \
            --max-time 30)

          echo "HTTP Status: $response"

          if [ "$response" != "200" ]; then
            echo "Cron endpoint returned non-200 status: $response"
            exit 1
          fi
